crons:
  - name: audit-verify
    description: "Verifies and checkpoints the tamper-evident audit chain in dev and staging every 30 minutes"
    cron: "*/30 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/verify-audit"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: weekly-governance-digest
    description: "Generates a weekly governance digest (approvals, audit growth, emergency pauses) stored as a broadcast notification. No email sent."
    cron: "0 13 * * 1"
    endpoint: "{{BASE_URL}}/api/cron/weekly-digest"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: usage-retention
    description: "DEV-ONLY: rolls up usage measurement events into de-identified aggregates then hard-deletes raw past 30 days and aggregates past 24 months."
    cron: "30 2 * * *"
    endpoint: "{{BASE_URL}}/api/cron/usage-retention"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
